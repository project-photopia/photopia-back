services:
  - type: web
    name: photopia-back
    runtime: docker
    region: frankfurt
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER_USERNAME
        sync: false
      - key: DB_USER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        sync: false
