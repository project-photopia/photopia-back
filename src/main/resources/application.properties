# Load .env file natively very early for logback
spring.config.import=optional:file:.env

spring.application.name=photopia-back
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://postgresql-photopia.alwaysdata.net:5432/photopia_db}
spring.datasource.username=${DB_USER_USERNAME}
spring.datasource.password=${DB_USER_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.main.lazy-initialization=true

r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket-name=photopia

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.diskspace.enabled=false
management.health.redis.enabled=false
management.health.mail.enabled=false
management.info.git.mode=full

# --- Grafana Cloud OTLP (Metrics & Traces) ---
grafana.otlp.url=${GRAFANA_OTLP_URL:http://localhost:4318}
grafana.otlp.token=${GRAFANA_OTLP_TOKEN:}
grafana.loki.url=${GRAFANA_LOKI_URL:http://localhost:3100/loki/api/v1/push}
grafana.loki.user=${GRAFANA_LOKI_USER:}
grafana.loki.password=${GRAFANA_LOKI_PASSWORD:}

management.otlp.metrics.export.url=${grafana.otlp.url}/v1/metrics
management.otlp.metrics.export.headers.Authorization=${grafana.otlp.token}

management.otlp.tracing.export.url=${grafana.otlp.url}/v1/traces
management.otlp.tracing.export.headers.Authorization=${grafana.otlp.token}

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


# Swagger / OpenAPI
springdoc.show-actuator=true

# Resend
resend.api-key=${RESEND_API_KEY:}
resend.url=${RESEND_URL:https://api.resend.com}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}

firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}

