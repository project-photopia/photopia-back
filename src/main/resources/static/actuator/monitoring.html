<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photopia Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --success-color: #03dac6;
            --error-color: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(187, 134, 252, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-up {
            background-color: rgba(3, 218, 198, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .status-down {
            background-color: rgba(207, 102, 121, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        canvas {
            width: 100% !important;
            height: 250px !important;
        }
        
        #health-details {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .health-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Photopia Monitoring</h1>

    <div class="dashboard-grid">
        <!-- Health Status Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">System Health</span>
                <span id="global-status" class="status-badge status-up">Checking...</span>
            </div>
            <div id="health-details">
                <!-- Details injected by JS -->
            </div>
        </div>

        <!-- JVM Memory Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">JVM Memory</span>
            </div>
            <canvas id="memoryChart"></canvas>
        </div>

        <!-- HTTP Requests Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">HTTP Requests (Total)</span>
            </div>
            <div class="metric-value" id="request-count">0</div>
             <canvas id="requestsChart"></canvas>
        </div>
        
        <!-- CPU Usage Card -->
        <div class="card">
             <div class="card-header">
                <span class="card-title">CPU Usage</span>
            </div>
            <canvas id="cpuChart"></canvas>
        </div>
    </div>

    <script>
        // --- Chart Configurations ---
        Chart.defaults.color = '#a0a0a0';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        const createLineChart = (ctx, label, color) => {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        backgroundColor: color.replace('1)', '0.2)'),
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: false }, // Hide x-axis labels for clean look
                        y: { beginAtZero: true }
                    },
                    animation: false
                }
            });
        };

        const memoryCtx = document.getElementById('memoryChart').getContext('2d');
        const memoryChart = createLineChart(memoryCtx, 'Used Memory (MB)', 'rgba(187, 134, 252, 1)');

        const cpuCtx = document.getElementById('cpuChart').getContext('2d');
        const cpuChart = createLineChart(cpuCtx, 'System CPU Load (%)', 'rgba(3, 218, 198, 1)');
        
        // --- Data Fetching Logic ---

        const updateChart = (chart, value) => {
            const now = new Date().toLocaleTimeString();
            if (chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(value);
            chart.update();
        };

        const fetchHealth = async () => {
            try {
                const response = await fetch('/actuator/health');
                const data = await response.json();
                
                // Update Global Status
                const statusBadge = document.getElementById('global-status');
                statusBadge.textContent = data.status;
                if (data.status === 'UP') {
                    statusBadge.className = 'status-badge status-up';
                } else {
                    statusBadge.className = 'status-badge status-down';
                }

                // Update Details
                const detailsContainer = document.getElementById('health-details');
                detailsContainer.innerHTML = '';
                
                if(data.components) {
                    for (const [key, value] of Object.entries(data.components)) {
                        const div = document.createElement('div');
                        div.className = 'health-item';
                        const statusClass = value.status === 'UP' ? 'status-up' : 'status-down';
                        // Simple check for disk space detail or generic detail
                        let detailText = value.status;
                        if (key === 'diskSpace' && value.details) {
                            detailText += ` (${(value.details.free / 1024 / 1024 / 1024).toFixed(2)} GB free)`;
                        }
                        div.innerHTML = `<span>${key}</span> <span class="${statusClass}" style="padding: 2px 8px; border-radius: 4px; font-size: 0.8em;">${detailText}</span>`;
                        detailsContainer.appendChild(div);
                    }
                }
            } catch (error) {
                console.error('Error fetching health:', error);
            }
        };

        const fetchMetrics = async () => {
             // Memory
            try {
                const res = await fetch('/actuator/metrics/jvm.memory.used');
                const data = await res.json();
                const usedMB = (data.measurements[0].value / 1024 / 1024).toFixed(1);
                updateChart(memoryChart, usedMB);
            } catch (e) { console.error('Memory metric error', e); }

            // HTTP Requests
            try {
                const res = await fetch('/actuator/metrics/http.server.requests');
                if(res.ok) {
                    const data = await res.json();
                    const count = data.measurements.find(m => m.statistic === 'COUNT')?.value || 0;
                    document.getElementById('request-count').textContent = count;
                }
            } catch (e) { console.error('HTTP metric error', e); }
            
             // CPU (System)
            try {
                const res = await fetch('/actuator/metrics/system.cpu.usage');
                 if(res.ok) {
                    const data = await res.json();
                     // value is 0.0 to 1.0 usually
                    const percent = (data.measurements[0].value * 100).toFixed(1);
                    updateChart(cpuChart, percent);
                 }
            } catch (e) { console.error('CPU metric error', e); }
        };

        // --- Init ---
        setInterval(() => {
            fetchHealth();
            fetchMetrics();
        }, 5000); // Update every 5 seconds

        fetchHealth();
        fetchMetrics();

    </script>
</body>
</html>
