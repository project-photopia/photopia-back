spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable R2/S3 for tests or mock it (but integration tests might need it if not mocked)
# Providing dummy values to satisfy @Value injection if not mocked
r2.account-id=test-account-id
r2.access-key=test-access-key
r2.secret-key=test-secret-key
r2.bucket-name=test-bucket
jwt.secret=test-very-long-secret-key-for-jwt-signing-minimum-256-bits
